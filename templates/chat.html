<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Friendly Chat</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top left, #4f46e5, #0f172a 60%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .chat-container {
      width: 100%;
      max-width: 560px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.86);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    .chat-header {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }
    .chat-header h2 {
      margin: 0;
      font-size: 17px;
    }
    .chat-header a {
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
    .online-users {
      padding: 10px 16px;
      font-size: 13px;
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
    }
    .pinned {
      min-height: 20px;
      padding: 10px 16px;
      font-size: 13px;
      color: #fde68a;
      background: rgba(250, 204, 21, 0.08);
      border-left: 4px solid #facc15;
    }
    .typing {
      min-height: 18px;
      padding: 4px 16px;
      font-size: 12px;
      color: #94a3b8;
    }
    .reply-indicator {
      display: none;
      padding: 8px 16px;
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
    }
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 78%;
      padding: 13px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .me {
      align-self: flex-end;
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      color: #fff;
    }
    .other {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.06);
      color: #e2e8f0;
    }
    .admin-highlight {
      border: 1px solid rgba(255,215,0,0.5);
      box-shadow: 0 0 14px rgba(255,215,0,0.15);
    }
    .reply-preview {
      font-size: 12px;
      margin-bottom: 8px;
      padding-left: 10px;
      border-left: 3px solid #22d3ee;
      color: #cbd5e1;
    }
    .timestamp {
      margin-top: 8px;
      font-size: 11px;
      opacity: 0.75;
    }
    .actions {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.9;
    }
    .actions span {
      cursor: pointer;
      margin-right: 10px;
      color: #93c5fd;
    }
    .actions span:hover {
      text-decoration: underline;
    }
    .chat-input {
      display: flex;
      gap: 8px;
      padding: 14px;
      background: rgba(255,255,255,0.05);
    }
    .chat-input input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: #fff;
      outline: none;
    }
    .chat-input input[type="text"]::placeholder {
      color: #94a3b8;
    }
    .chat-input button {
      border: none;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-weight: 700;
    }
    .hidden { display: none; }
    .file-preview img {
      max-width: 180px;
      border-radius: 10px;
      margin-top: 8px;
    }
    .file-preview a {
      color: #7dd3fc;
      text-decoration: none;
      font-weight: 700;
    }
    @media (min-width: 768px) {
      .chat-container {
        height: 94vh;
        max-height: 900px;
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h2>Private Chat — {{ username }}</h2>
      <a href="/logout">Logout</a>
    </div>

    <div class="online-users" id="users">Online: loading...</div>
    <div class="pinned" id="pinned">No pinned message</div>
    <div class="typing" id="typing"></div>
    <div class="reply-indicator" id="reply-indicator"></div>

    <div class="chat-box" id="chat-box"></div>

    <div class="chat-input">
      <input id="msg" type="text" placeholder="Type a message...">
      <input type="file" id="fileInput" class="hidden" onchange="sendFile()">
      <button type="button" onclick="document.getElementById('fileInput').click()">📎</button>
      <button type="button" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const socket = io();
    const username = "{{ username }}";
    let replyTo = null;

    socket.on("connect", function () {
      socket.emit("join");
    });

    socket.on("chat_history", function (messages) {
      const box = document.getElementById("chat-box");
      box.innerHTML = "";
      messages.forEach(function (msg) {
        appendMessage(msg);
      });
    });

    socket.on("update_users", function (users) {
      document.getElementById("users").textContent =
        "Online (" + users.length + "): " + users.join(", ");
    });

    socket.on("receive_message", function (data) {
      appendMessage(data);
    });

    socket.on("show_pinned", function (data) {
      document.getElementById("pinned").textContent = "📌 Pinned: " + (data.text || "");
    });

    socket.on("show_typing", function (data) {
      if (data.sender !== username) {
        document.getElementById("typing").textContent = data.sender + " is typing...";
        setTimeout(function () {
          document.getElementById("typing").textContent = "";
        }, 1200);
      }
    });

    socket.on("receive_file", function (data) {
      appendFileMessage(data);
    });

    socket.on("file_error", function (data) {
      alert(data.error || "Upload failed");
    });

    function getTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function sendMessage() {
      const input = document.getElementById("msg");
      const text = input.value.trim();
      if (!text) return;

      socket.emit("send_message", {
        text: text,
        time: getTime(),
        reply: replyTo
      });

      replyTo = null;
      input.value = "";
      input.placeholder = "Type a message...";
      document.getElementById("reply-indicator").style.display = "none";
    }

    document.getElementById("msg").addEventListener("input", function () {
      socket.emit("typing", { sender: username });
    });

    document.getElementById("msg").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    function setReply(text) {
      replyTo = text;
      const box = document.getElementById("reply-indicator");
      box.style.display = "block";
      box.textContent = "Replying to: " + text;
      document.getElementById("msg").focus();
    }

    function pinMessage(text) {
      socket.emit("pin_message", { text: text });
    }

    function sendFile() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        socket.emit("send_file", {
          fileName: file.name,
          fileType: file.type,
          fileData: e.target.result
        });
      };
      reader.readAsDataURL(file);
      fileInput.value = "";
    }

    function appendMessage(data) {
      const div = document.createElement("div");
      const mine = data.sender === username;
      div.className = "message " + (mine ? "me" : "other") + (data.role === "admin" ? " admin-highlight" : "");
      div.id = data.id;

      let replyHtml = "";
      if (data.reply) {
        replyHtml = `<div class="reply-preview">Reply to: ${escapeHtml(data.reply)}</div>`;
      }

      div.innerHTML = `
        ${replyHtml}
        <strong>${escapeHtml(data.sender)}${data.role === "admin" ? " 👑" : ""}</strong><br>
        ${escapeHtml(data.text || "")}
        <div class="timestamp">${escapeHtml(data.time || "")}</div>
        <div class="actions">
          <span onclick="setReply(${JSON.stringify(data.text || "")})">↩ Reply</span>
          <span onclick="pinMessage(${JSON.stringify(data.text || "")})">📌 Pin</span>
        </div>
      `;

      const box = document.getElementById("chat-box");
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function appendFileMessage(data) {
      const div = document.createElement("div");
      const mine = data.sender === username;
      div.className = "message " + (mine ? "me" : "other") + (data.role === "admin" ? " admin-highlight" : "");

      let html = `<strong>${escapeHtml(data.sender)}${data.role === "admin" ? " 👑" : ""}</strong><div class="file-preview">`;

      if (data.fileType && data.fileType.startsWith("image/")) {
        html += `<img src="${data.fileData}" alt="Uploaded image">`;
      } else {
        const label = data.originalName || data.fileName || "File";
        html += `<a href="${data.fileData}" download="${escapeHtml(label)}">📁 ${escapeHtml(label)}</a>`;
      }

      html += `</div>`;
      div.innerHTML = html;

      const box = document.getElementById("chat-box");
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text ?? "";
      return div.innerHTML;
    }
  </script>
</body>
</html>

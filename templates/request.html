<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Access | Friendly Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 22px;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      color: #fff;
    }
    h2 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      margin-bottom: 24px;
      font-size: 14px;
      opacity: 0.9;
    }
    .alert {
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      text-align: center;
    }
    .alert.error {
      background: rgba(239, 68, 68, 0.22);
    }
    .alert.success {
      background: rgba(34, 197, 94, 0.22);
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .input-group input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 15px;
    }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔐 Friendly Chat</h2>
    <div class="subtitle">Request admin approval to join the private chat</div>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}

    {% if success %}
      <div class="alert success">{{ success }}</div>
    {% endif %}

    <form method="POST">
      <div class="input-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required>
      </div>

      <button class="btn" type="submit">Request Access / Login</button>
    </form>

    <div class="footer">New users need admin approval before entering chat.</div>
  </div>
</body>
</html>
